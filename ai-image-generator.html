<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Generator | ToolNova</title>
    <meta name="description" content="Generate images from text prompts with ToolNova.">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <nav>
        <a href="./index.html" class="logo">ToolNova</a>
        <div class="nav-links">
            <a href="./index.html">Home</a>
        </div>
    </nav>
</header>

<main>
    <section class="hero">
        <h1>AI Image Generator</h1>
        <p>Turn your ideas into images.</p>
    </section>

    <section class="tool-box">
        <label for="prompt"><strong>Describe your image</strong></label>

        <textarea
            id="prompt"
            maxlength="500"
            placeholder="Example: A beautiful mountain under a starry sky..."
        ></textarea>
        <label for="imageStyle"><strong>Choose image style</strong></label>

<select id="imageStyle">
    <option value="realistic">Realistic</option>
    <option value="anime">Anime</option>
    <option value="3D digital art">3D</option>
    <option value="watercolor painting">Watercolor</option>
    <option value="pixel art">Pixel Art</option>
</select>

        <button id="generateBtn" type="button">
            Generate Image
        </button>

        <p id="status" role="status">
            Enter a description to get started.
        </p>

        <div id="imageResult" hidden>
            <img
                id="generatedImage"
                alt="AI-generated image"
                style="width:100%;height:auto;border-radius:8px;"
            >

            <p>
                <a id="downloadBtn" class="button" download="toolnova-image.png">
                    Download Image
                </a>
            </p>
        </div>
    </section>
</main>

<footer>
    <p>© 2026 ToolNova</p>
</footer>

<script>
const promptInput = document.getElementById("prompt");
const generateBtn = document.getElementById("generateBtn");
const statusText = document.getElementById("status");
const imageResult = document.getElementById("imageResult");
const generatedImage = document.getElementById("generatedImage");
const downloadBtn = document.getElementById("downloadBtn");

generateBtn.addEventListener("click", async () => {
    const prompt = promptInput.value.trim();

    if (!prompt) {
        statusText.textContent = "Please describe the image you want.";
        return;
    }

    generateBtn.disabled = true;
    imageResult.hidden = true;
    statusText.textContent = "Connecting to the image service...";

    try {
        const response = await fetch(
            "https://image.pollinations.ai/prompt/" +
            encodeURIComponent(prompt)
        );

        if (!response.ok) {
            throw new Error("The image service is unavailable. Please try again later.");
        }

        const imageBlob = await response.blob();

        if (!imageBlob.type.startsWith("image/")) {
            throw new Error("The service did not return an image. Please try again.");
        }

        const imageUrl = URL.createObjectURL(imageBlob);

        generatedImage.src = imageUrl;
        downloadBtn.href = imageUrl;
        imageResult.hidden = false;
        statusText.textContent = "Your image is ready!";

    } catch (error) {
        statusText.textContent =
            error.message || "Unable to generate an image. Please try again.";
    } finally {
        generateBtn.disabled = false;
    }
});
</script>

</body>
</html>
